<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रोफेशनल स्कूल पेपर जनरेटर</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background-color: #f4f6f9; 
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* सेटिंग्स पैनल */
        .controls { 
            background: #fff; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .controls h2 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid #333; padding-bottom: 5px; }
        
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #333; }
        .input-group input, .input-group select, .input-group textarea { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 14px; 
            box-sizing: border-box;
        }
        .input-group textarea { height: 120px; resize: vertical; white-space: pre-wrap; }

        /* ग्रिड सेटिंग्स फॉर्म के लिए */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; }
        .btn-update { background: #007bff; }
        .btn-print { background: #28a745; }

        /* प्रीव्यू एरिया */
        .preview-wrapper { overflow-x: auto; background: #e0e0e0; padding: 15px 5px; text-align: center; }
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            box-sizing: border-box;
            margin: 0 auto;
            display: grid;
            transform-origin: top center;
            transform: scale(0.45);
            margin-bottom: -160mm;
        }

        /* पेज लेआउट */
        .layout-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 15mm; }
        .layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10mm; }
        .layout-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 8mm; }
        .layout-8 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr 1fr; gap: 5mm; }

        /* पेपर बॉक्स */
        .paper-box {
            border: 1px solid #000;
            padding: 8mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .school-name { text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 2px; color: #000; }
        .sub-header { text-align: center; font-size: 12px; font-weight: bold; border-bottom: 1.5px solid #000; padding-bottom: 4px; margin-bottom: 8px; }

        /* प्रश्नों का कंटेनर (JS से कंट्रोल होगा) */
        .questions-container {
            flex-grow: 1;
            height: 100%;
            text-align: justify;
        }
        
        .question-line { margin-bottom: 4px; break-inside: avoid; }

        /* वाटरमार्क */
        .watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 45px; color: rgba(0, 0, 0, 0.06);
            font-weight: bold; pointer-events: none; white-space: nowrap; z-index: 0;
        }

        /* प्रिंट कमांड्स */
        @media print {
            @page { size: A4; margin: 0; }
            body { margin: 0; padding: 0; background: none; }
            .controls { display: none !important; }
            .preview-wrapper { padding: 0; background: none; overflow: visible; }
            .a4-page { transform: scale(1); margin: 0; border: none; page-break-after: always; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- सेटिंग्स फॉर्म -->
        <div class="controls">
            <h2>प्रोफेशनल पेपर सेटिंग्स</h2>
            
            <div class="input-group">
                <label>स्कूल का नाम:</label>
                <input type="text" id="schoolName" value="GURUKUL SCHOOL DHANKOLI">
            </div>
            
            <div class="input-group">
                <label>क्लास, विषय और अंक:</label>
                <input type="text" id="subHeader" value="कक्षा:  | विषय:  | पूर्णांक: ">
            </div>

            <div class="input-group">
                <label>प्रश्न (हर लाइन में एक प्रश्न):</label>
                <textarea id="questionsText">1. </textarea>
            </div>

            <div class="settings-grid">
                <div class="input-group">
                    <label>पेपर लेआउट:</label>
                    <select id="layoutSelect">
                        <option value="2">2 पेपर (A4 पर)</option>
                        <option value="4" selected>4 पेपर (A4 पर)</option>
                        <option value="6">6 पेपर (A4 पर)</option>
                        <option value="8">8 पेपर (A4 पर)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>प्रश्नों का स्टाइल:</label>
                    <select id="columnStyle">
                        <option value="1">पूरे पेज पर सीधा (1 Column)</option>
                        <option value="2-auto" selected>2 कॉलम (पहले एक साइड भरें)</option>
                        <option value="2-balance">2 कॉलम (दोनों साइड बराबर)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>फॉन्ट साइज़:</label>
                    <select id="fontSize">
                        <option value="9px">छोटा (9px)</option>
                        <option value="10px" selected>नॉर्मल (10px)</option>
                        <option value="11px">बड़ा (11px)</option>
                        <option value="12px">बहुत बड़ा (12px)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>लाइन स्पेसिंग:</label>
                    <select id="lineSpacing">
                        <option value="1.2">कम (1.2)</option>
                        <option value="1.4" selected>नॉर्मल (1.4)</option>
                        <option value="1.6">ज्यादा (1.6)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>वाटरमार्क (ऑप्शनल):</label>
                <input type="text" id="watermarkText" value="GPS DHANKOLI">
            </div>

            <div class="btn-row">
                <button class="btn btn-update" onclick="generatePaper()">पेपर अपडेट करें</button>
                <button class="btn btn-print" onclick="window.print()">🖨️ PDF बनाएं</button>
            </div>
        </div>

        <!-- A4 पेज प्रीव्यू -->
        <div class="preview-wrapper">
            <div class="a4-page layout-4" id="a4Page">
            </div>
        </div>
    </div>

    <script>
        function generatePaper() {
            const school = document.getElementById('schoolName').value;
            const subHeader = document.getElementById('subHeader').value;
            const watermark = document.getElementById('watermarkText').value;
            const questionsRaw = document.getElementById('questionsText').value;
            
            // सेटिंग्स
            const layout = parseInt(document.getElementById('layoutSelect').value);
            const columnStyle = document.getElementById('columnStyle').value;
            const fontSize = document.getElementById('fontSize').value;
            const lineSpacing = document.getElementById('lineSpacing').value;

            // प्रश्नों को HTML में बदलें
            const questionsArray = questionsRaw.split('\n');
            let questionsHTML = '';
            questionsArray.forEach(q => {
                if(q.trim() !== "") {
                    questionsHTML += `<div class="question-line">${q}</div>`;
                }
            });

            // कॉलम की CSS तय करें
            let columnCSS = '';
            if (columnStyle === '1') {
                columnCSS = 'column-count: 1;';
            } else if (columnStyle === '2-auto') {
                columnCSS = 'column-count: 2; column-gap: 15px; column-fill: auto;';
            } else if (columnStyle === '2-balance') {
                columnCSS = 'column-count: 2; column-gap: 15px; column-fill: balance;';
            }

            // सिंगल पेपर का कोड
            const singlePaperHTML = `
                <div class="watermark">${watermark}</div>
                <div class="school-name">${school}</div>
                <div class="sub-header">${subHeader}</div>
                <div class="questions-container" style="position: relative; z-index: 1; ${columnCSS} font-size: ${fontSize}; line-height: ${lineSpacing};">
                    ${questionsHTML}
                </div>
            `;

            // पेज को अपडेट करें
            const page = document.getElementById('a4Page');
            page.className = 'a4-page layout-' + layout;
            page.innerHTML = '';

            for (let i = 0; i < layout; i++) {
                const box = document.createElement('div');
                box.className = 'paper-box';
                box.innerHTML = singlePaperHTML;
                page.appendChild(box);
            }
        }

        window.onload = generatePaper;
    </script>
</body>
</html>
<!-- यहाँ से वर्टिकल और Bilingual (हिंदी-English) दोनों का कोड शुरू -->
<style>
    /* 2 पेपर वर्टिकल (Left-Right) लेआउट */
    .layout-2-vertical { 
        grid-template-columns: 1fr 1fr; 
        grid-template-rows: 1fr; 
        gap: 15mm; 
    }

    /* Bilingual लेआउट के लिए ग्रिड सिस्टम */
    .layout-1-bilingual { 
        grid-template-columns: 1fr; 
        grid-template-rows: 1fr; 
    }
    .bilingual-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        column-gap: 20px; 
        width: 100%; 
    }
    .bilingual-row { 
        display: contents; 
    }
    .bilingual-left { 
        padding-right: 10px; 
        border-right: 1px dashed #ccc; 
        break-inside: avoid; 
    }
    .bilingual-right { 
        padding-left: 10px; 
        break-inside: avoid; 
    }
</style>

<script>
    const layoutDropdown = document.getElementById('layoutSelect');

    // 1. '2 पेपर (Vertical)' ऑप्शन जोड़ें
    const verticalOption = document.createElement('option');
    verticalOption.value = '2-vertical';
    verticalOption.innerHTML = '2 पेपर (Vertical - अगल-बगल)';
    layoutDropdown.insertBefore(verticalOption, layoutDropdown.options[1]);

    // 2. '1 पेपर (Bilingual)' ऑप्शन जोड़ें
    const bilingualOption = document.createElement('option');
    bilingualOption.value = '1-bilingual';
    bilingualOption.innerHTML = '1 पेपर (Bilingual: हिंदी | English)';
    layoutDropdown.appendChild(bilingualOption);

    // 3. अपडेटेड मेन फंक्शन (जो वर्टिकल और Bilingual दोनों को संभालेगा)
    function generatePaper() {
        const school = document.getElementById('schoolName').value;
        const subHeader = document.getElementById('subHeader').value;
        const watermark = document.getElementById('watermarkText').value;
        const questionsRaw = document.getElementById('questionsText').value;
        
        const layoutVal = document.getElementById('layoutSelect').value; 
        const boxCount = parseInt(layoutVal) || 1;
        const columnStyle = document.getElementById('columnStyle').value;
        const fontSize = document.getElementById('fontSize').value;
        const lineSpacing = document.getElementById('lineSpacing').value;

        let questionsHTML = '';

        // अगर Bilingual चुना गया है
        if (layoutVal === '1-bilingual') {
            questionsHTML = '<div class="bilingual-grid">';
            const questionsArray = questionsRaw.split('\n');
            questionsArray.forEach(q => {
                if(q.trim() !== "") {
                    const parts = q.split('|');
                    const leftText = parts[0] ? parts[0].trim() : '';
                    const rightText = parts[1] ? parts[1].trim() : '';
                    
                    questionsHTML += `
                        <div class="bilingual-row">
                            <div class="question-line bilingual-left">${leftText}</div>
                            <div class="question-line bilingual-right">${rightText}</div>
                        </div>`;
                }
            });
            questionsHTML += '</div>';
        } else {
            const questionsArray = questionsRaw.split('\n');
            questionsArray.forEach(q => {
                if(q.trim() !== "") {
                    questionsHTML += `<div class="question-line">${q}</div>`;
                }
            });
        }

        let columnCSS = '';
        if (layoutVal !== '1-bilingual') {
            if (columnStyle === '1') columnCSS = 'column-count: 1;';
            else if (columnStyle === '2-auto') columnCSS = 'column-count: 2; column-gap: 15px; column-fill: auto;';
            else if (columnStyle === '2-balance') columnCSS = 'column-count: 2; column-gap: 15px; column-fill: balance;';
        }

        const singlePaperHTML = `
            <div class="watermark">${watermark}</div>
            <div class="school-name">${school}</div>
            <div class="sub-header">${subHeader}</div>
            <div class="questions-container" style="position: relative; z-index: 1; ${columnCSS} font-size: ${fontSize}; line-height: ${lineSpacing};">
                ${questionsHTML}
            </div>
        `;

        const page = document.getElementById('a4Page');
        page.className = 'a4-page layout-' + layoutVal; 
        page.innerHTML = '';

        for (let i = 0; i < (layoutVal === '1-bilingual' ? 1 : boxCount); i++) {
            const box = document.createElement('div');
            box.className = 'paper-box';
            box.innerHTML = singlePaperHTML;
            page.appendChild(box);
        }
    }

    generatePaper();
</script>
<!-- यहाँ वर्टिकल और Bilingual दोनों का कोड खत्म -->
